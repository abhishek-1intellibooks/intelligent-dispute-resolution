# Triage (Ch. 9): the model service chapter09/triage_service.py (deploy/Dockerfile.triage),
# and the consumer that calls it for each claim.received and emits claim.classified.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: triage-api
  namespace: disputes
  labels:
    app: triage-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: triage-api
  template:
    metadata:
      labels:
        app: triage-api
    spec:
      containers:
      - name: triage-api
        image: dispute/triage:1.0
        env:
        - name: KAFKA_BOOTSTRAP
          value: events:9092
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: triage-api-db
              key: url
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            memory: 256Mi
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
        ports:
        - containerPort: 8000
        readinessProbe:
          httpGet:
            path: /docs
            port: 8000
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: triage-api
  namespace: disputes
spec:
  selector:
    app: triage-api
  ports:
  - port: 8000
    targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: triage
  namespace: disputes
  labels:
    app: triage
spec:
  replicas: 2
  selector:
    matchLabels:
      app: triage
  template:
    metadata:
      labels:
        app: triage
    spec:
      containers:
      - name: triage
        image: dispute/case:1.0
        env:
        - &id001
          name: KAFKA_BOOTSTRAP
          value: events:9092
        - &id002
          name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: triage-db
              key: url
        - name: ROLE
          value: consumer
        - name: GROUP
          value: triage
        - name: TOPICS
          value: claim.received
        - name: HANDLER
          value: handlers:triage
        - name: TRIAGE_URL
          value: http://triage-api:8000/triage
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            memory: 256Mi
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
      - name: outbox-relay
        image: dispute/case:1.0
        env:
        - *id001
        - *id002
        - name: ROLE
          value: relay
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 128Mi
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
