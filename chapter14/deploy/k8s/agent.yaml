# Agent (Ch. 13): chapter13/agent.py with its policy gate (Dockerfile.worker, CHAPTER=chapter13).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent
  namespace: disputes
  labels:
    app: agent
spec:
  replicas: 2
  selector:
    matchLabels:
      app: agent
  template:
    metadata:
      labels:
        app: agent
    spec:
      containers:
      - name: agent
        image: dispute/agent:1.0
        env:
        - &id001
          name: KAFKA_BOOTSTRAP
          value: events:9092
        - &id002
          name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: agent-db
              key: url
        - name: ROLE
          value: consumer
        - name: GROUP
          value: agent
        - name: TOPICS
          value: claim.classified,merchant.replied
        - name: HANDLER
          value: handlers:agent
        - name: MODEL_GATEWAY_URL
          value: http://model-gateway:8000
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            memory: 256Mi
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
      - name: outbox-relay
        image: dispute/agent:1.0
        env:
        - *id001
        - *id002
        - name: ROLE
          value: relay
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 128Mi
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
