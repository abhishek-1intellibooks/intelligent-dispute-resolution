# Intake (chapter14/intake_service.py): validates, records the claim and its event, replies.
# Image: deploy/Dockerfile.intake.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: intake
  namespace: disputes
  labels:
    app: intake
spec:
  replicas: 4
  selector:
    matchLabels:
      app: intake
  template:
    metadata:
      labels:
        app: intake
    spec:
      containers:
      - name: intake
        image: dispute/intake:1.0
        env:
        - name: KAFKA_BOOTSTRAP
          value: events:9092
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: intake-db
              key: url
        resources:
          requests:
            cpu: 500m
            memory: 256Mi
          limits:
            memory: 256Mi
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: intake
  namespace: disputes
spec:
  selector:
    app: intake
  ports:
  - port: 8080
    targetPort: 8080
